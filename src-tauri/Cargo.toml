[package]
name = "bitcrane"
version = "0.2.0"
description = "Bitcrane: SFTP file transfer with automatic folder watching"
authors = ["RaccoonWorks"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Raccoon-Works/bitcrane"
edition = "2021"
rust-version = "1.85"

[lib]
name = "bitcrane_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["full"] }
russh = "0.65"
russh-sftp = "3"
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
base64 = "0.22"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
notify = "8"
notify-debouncer-full = "0.7"
globset = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
trash = "5"
walkdir = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }
filetime = "0.2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
rand = { version = "0.10", features = ["thread_rng"] }
roxmltree = "0.21.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider", "stream", "http2", "socks"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
bytes = "1"
percent-encoding = "2"
png = "0.18"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
keepawake = "0.5"

[dev-dependencies]
tempfile = "3"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
# System file symbols (sysicons.rs).
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_Controls", "Win32_System_Com"] }

[target.'cfg(target_os = "macos")'.dependencies]
# System file symbols (sysicons.rs).
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSDictionary", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage"] }
