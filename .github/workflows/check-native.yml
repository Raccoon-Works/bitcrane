# Runs Clippy on the Rust part on Windows without building installers or publishing
# anything: platform-specific code (e.g. the jump list in iconmenu.rs) cannot be
# compiled on Linux. Any warning fails the check, like on Linux.
name: Check native code

# Runs on a push to the branch "native-check" (manual dispatch would need the
# file on the default branch, which stays untouched).
on:
  push:
    branches: [native-check]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Windows only: GitHub often has no free Mac runner (a cancelled job sends a
        # "Run failed" mail), and the release build compiles for the Mac anyway.
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # tauri::generate_context! needs the frontend folder to exist; an empty page is enough here.
      - name: Placeholder frontend
        shell: bash
        run: mkdir -p dist && echo '<!doctype html><title>check</title>' > dist/index.html

      - name: Clippy
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --message-format=short -- -D warnings 2>&1 | tee check.log

      # The full log is not always reachable from outside; errors and warnings also become annotations.
      - name: Report problems as annotations
        if: failure()
        shell: bash
        run: |
          grep -E '^src.*(error|warning)' check.log | head -40 | sed 's/^/::error::/' || true
