# Code checks without building installers or publishing anything. Every warning
# fails a check, so the code base stays at zero warnings:
# - interface: Prettier, ESLint, the TypeScript compiler, the production build and the unit
#   tests (Vitest); html-validate on the pages of the website,
# - Rust: rustfmt, Clippy and the tests on Windows, where the platform code (e.g. the
#   jump list in iconmenu.rs) is compiled, and Clippy and the tests on macOS (see rust-macos).
name: Checks

# The branch "native-check" runs the checks before anything reaches main; a run started by hand
# (Actions tab or `gh workflow run checks.yml`) also includes the macOS job.
on:
  push:
    branches: [main, native-check]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      # Type check and production build, so a build-only error (an import Vite cannot resolve) shows here.
      - run: npm run build
      - run: npm test
      - run: npm run validate:website

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # tauri::generate_context! needs the frontend folder to exist; an empty page is enough here.
      - name: Placeholder frontend
        shell: bash
        run: mkdir -p dist && echo '<!doctype html><title>check</title>' > dist/index.html

      - name: Clippy
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --message-format=short -- -D warnings 2>&1 | tee check.log

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      # The full log is not always reachable from outside; errors and warnings also become annotations.
      - name: Report problems as annotations
        if: failure()
        shell: bash
        run: |
          grep -E '^src.*(error|warning)' check.log | head -40 | sed 's/^/::error::/' || true

  rust-macos:
    # GitHub often has no free Mac runner. `continue-on-error` is not enough: it lets a failed job
    # pass, but a job that never gets a runner ends the run as cancelled, and GitHub notifies about
    # cancelled runs too ("Run failed" mail). So this job runs on pull requests and when started
    # by hand, not on every push.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # tauri::generate_context! needs the frontend folder to exist; an empty page is enough here.
      - name: Placeholder frontend
        run: mkdir -p dist && echo '<!doctype html><title>check</title>' > dist/index.html

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
