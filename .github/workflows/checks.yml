# Code checks without building installers or publishing anything. Every warning
# fails a check, so the code base stays at zero warnings:
# - interface: Prettier, ESLint and the TypeScript compiler,
# - Rust: rustfmt and Clippy on Windows, where the platform code (e.g. the jump list
#   in iconmenu.rs) is compiled. The release build compiles the Mac code.
name: Checks

# The branch "native-check" runs the checks before anything reaches main.
on:
  push:
    branches: [main, native-check]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npx tsc -b

  rust:
    # Windows only: GitHub often has no free Mac runner (a cancelled job sends a
    # "Run failed" mail), and the release build compiles for the Mac anyway.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # tauri::generate_context! needs the frontend folder to exist; an empty page is enough here.
      - name: Placeholder frontend
        shell: bash
        run: mkdir -p dist && echo '<!doctype html><title>check</title>' > dist/index.html

      - name: Clippy
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --message-format=short -- -D warnings 2>&1 | tee check.log

      # The full log is not always reachable from outside; errors and warnings also become annotations.
      - name: Report problems as annotations
        if: failure()
        shell: bash
        run: |
          grep -E '^src.*(error|warning)' check.log | head -40 | sed 's/^/::error::/' || true
