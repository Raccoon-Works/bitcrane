# Builds Bitcrane for macOS (Apple Silicon + Intel) and Windows on request.
#
# - Every build becomes a release of this repository (tag v<version>) with
#   release notes in sections (Features / Improvements / Fixes), the installers
#   and the signed update description latest.json. Installed copies look for
#   updates at releases/latest/download/latest.json of this repository.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY  private key that signs updates
name: Build

# Builds run only when started by hand (Actions tab or `gh workflow run`),
# to save the monthly Actions minutes; macOS minutes count extra.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Short summary (shown in the update window)"
        required: false
        default: "Improvements and fixes."
      added:
        description: "Features: items separated by |"
        required: false
        default: ""
      improved:
        description: "Improvements: items separated by |"
        required: false
        default: ""
      fixed:
        description: "Fixes: items separated by |"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Each build gets its own, increasing version so installed copies see it as new.
  APP_VERSION: 0.2.${{ github.run_number }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: mac
            args: --target universal-apple-darwin
          - platform: windows-latest
            name: windows
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Set version and update signing
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          node -e '
            const fs = require("fs");
            const p = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = process.env.APP_VERSION;
            // Without the signing key the build still works, just without update packages.
            if (process.env.HAS_KEY !== "true") c.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
          '
          echo "Version $APP_VERSION, update packages: $HAS_KEY"

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # App keys of the cloud services (Settings -> Secrets and variables -> Actions -> Variables).
          # Public by design for desktop apps; without them the services show as "not set up yet".
          BITCRANE_DROPBOX_KEY: ${{ vars.DROPBOX_APP_KEY }}
          BITCRANE_ONEDRIVE_KEY: ${{ vars.ONEDRIVE_CLIENT_ID }}
        with:
          args: ${{ matrix.args }}

      - name: Upload macOS files
        if: matrix.name == 'mac'
        uses: actions/upload-artifact@v5
        with:
          name: Bitcrane-mac
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

      - name: Upload Windows files
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v5
        with:
          name: Bitcrane-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  publish:
    # Publishes the build as a release of this repository.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = true ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "Update key missing, nothing published."; fi

      - uses: actions/download-artifact@v5
        if: steps.check.outputs.go == 'true'
        with:
          path: files

      - name: Collect files
        if: steps.check.outputs.go == 'true'
        run: |
          set -euo pipefail
          V="$APP_VERSION"
          mkdir out
          cp files/Bitcrane-mac/dmg/*.dmg "out/Bitcrane_${V}_universal.dmg"
          cp files/Bitcrane-mac/macos/*.app.tar.gz "out/Bitcrane_${V}_universal.app.tar.gz"
          cp files/Bitcrane-windows/nsis/*.exe "out/Bitcrane_${V}_x64-setup.exe"
          cp files/Bitcrane-windows/msi/*.msi "out/Bitcrane_${V}_x64.msi"
          cat files/Bitcrane-mac/macos/*.app.tar.gz.sig > mac.sig
          cat files/Bitcrane-windows/nsis/*.exe.sig > win.sig

      - name: Write update description and release notes
        if: steps.check.outputs.go == 'true'
        env:
          NOTES: ${{ inputs.notes }}
          ADDED: ${{ inputs.added }}
          IMPROVED: ${{ inputs.improved }}
          FIXED: ${{ inputs.fixed }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('fs');
          const v = process.env.APP_VERSION;
          const mac = fs.readFileSync('mac.sig', 'utf8').trim();
          const win = fs.readFileSync('win.sig', 'utf8').trim();
          // latest.json pointing at the files of this release.
          const latest = (base) => {
            const macEntry = { signature: mac, url: `${base}/Bitcrane_${v}_universal.app.tar.gz` };
            const winEntry = { signature: win, url: `${base}/Bitcrane_${v}_x64-setup.exe` };
            return JSON.stringify({ version: v, notes: process.env.NOTES, pub_date: new Date().toISOString(),
              platforms: { 'darwin-aarch64': macEntry, 'darwin-x86_64': macEntry, 'windows-x86_64': winEntry } }, null, 2);
          };
          fs.writeFileSync('out/latest.json', latest(`https://github.com/${process.env.REPO}/releases/download/v${v}`));
          const list = (s) => (s || '').split('|').map((x) => x.trim()).filter(Boolean).map((x) => `- ${x}`).join('\n');
          const section = (title, s) => (list(s) ? `## ${title}\n\n${list(s)}\n\n` : '');
          let body = section('Features', process.env.ADDED) + section('Improvements', process.env.IMPROVED) + section('Fixes', process.env.FIXED);
          if (!body) body = `${process.env.NOTES}\n\n`;
          body += `## Download

          | System | File |
          |---|---|
          | Windows | \`Bitcrane_${v}_x64-setup.exe\` |
          | Windows (MSI, for managed installs) | \`Bitcrane_${v}_x64.msi\` |
          | macOS (Apple Silicon and Intel) | \`Bitcrane_${v}_universal.dmg\` |

          The files are listed below under "Assets". Installed copies update themselves.

          ## macOS note

          Bitcrane is not notarized by Apple yet. After moving it to Applications, run this once in Terminal:

          \`\`\`
          xattr -dr com.apple.quarantine /Applications/Bitcrane.app
          \`\`\`

          Otherwise macOS reports the app as damaged. macOS asks once for access to Desktop, Documents and Downloads; granting Full Disk Access (Bitcrane settings) avoids these prompts.

          ## Windows note

          Bitcrane is not code-signed yet. On the first start, Microsoft Defender SmartScreen shows "Windows protected your PC" (German: „Der Computer wurde durch Windows geschützt“). Click "More info" („Weitere Informationen“), then "Run anyway" („Trotzdem ausführen“). Updates installed from within Bitcrane do not show this again.
          `.replace(/^          /gm, '');
          fs.writeFileSync('notes.md', body);
          JS
          cat notes.md

      - name: Create release
        if: steps.check.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$APP_VERSION" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Bitcrane $APP_VERSION" --notes-file notes.md --latest
